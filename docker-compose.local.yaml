# 本地构建镜像的覆盖文件：让 compose 使用你自己编译的 ami 代码，
# 而不是上游预置镜像。
#
#   docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.local.yaml up -d
#
# 用本地镜像时，容器内的二进制名为 ami-server / ami-channel，
# 与镜像内路径一致，无需 AMI_* 兼容变量。
services:
  migrate:
    image: ami/server:local
    entrypoint: ["/app/ami-server", "migrate", "up"]
  server:
    image: ami/server:local
    # 本地镜像的二进制叫 ami-server；上游镜像的 entrypoint 已被覆盖，
    # 这里显式指定，避免继承旧镜像的 entrypoint。
    entrypoint: ["/app/ami-server", "serve"]
  channel:
    image: ami/server:local
    entrypoint: ["/app/ami-channel", "serve"]
  web:
    image: ami/web:local
