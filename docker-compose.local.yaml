# 本地构建镜像的覆盖文件：让 compose 使用你自己编译的 ami 代码。
#
#   docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.local.yaml up -d
#
# 注意：不要覆盖 entrypoint。镜像里的 /entrypoint.sh 负责启动嵌套
# containerd、准备 cgroup 委派等，直接指定二进制会跳过这些步骤，
# 导致工作区永远起不来（表现为 bot 卡在 creating/failed）。
services:
  migrate:
    image: ami/server:local
    # migrate 是一次性任务，不需要 workspace 运行时，直接调二进制。
    entrypoint: ["/app/ami-server", "migrate", "up"]
  server:
    image: ami/server:local
  channel:
    image: ami/server:local
    entrypoint: ["/app/ami-channel", "serve"]
  web:
    image: ami/web:local
