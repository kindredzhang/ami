# 本地构建镜像的覆盖文件：让 compose 使用你自己编译的 ami 代码。
#
#   docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.local.yaml up -d
#
# 注意：不要覆盖 entrypoint。镜像里的 /entrypoint.sh 负责启动嵌套
# containerd、准备 cgroup 委派等，直接指定二进制会跳过这些步骤，
# 导致工作区永远起不来（表现为 bot 卡在 creating/failed）。
services:
  migrate:
    image: ami/server:local
    # migrate 是一次性任务，不需要 workspace 运行时，直接调二进制。
    entrypoint: ["/app/ami-server", "migrate", "up"]
  server:
    image: ami/server:local
  channel:
    image: ami/server:local
    entrypoint: ["/app/ami-channel", "serve"]
  web:
    image: ami/web:local
  # 内部依赖源。数据从宿主机的 skillhub-data/ 挂进来，发布依赖就是往那个
  # 目录放一个子目录再重启本容器，不需要重新构建镜像。
  # 接入方式：config.toml 里设
  #   [supermarket] catalog_base_url = "http://skillhub:8090"
  skillhub:
    image: ami/skillhub:local
    restart: unless-stopped
    # 必须和 server 在同一个网络，否则 server 解析不到 skillhub 这个主机名。
    networks:
      - ami-network
    volumes:
      - ./skillhub-data:/data:ro
    ports:
      # 只绑本机回环：宿主机排查用，不对外暴露。
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
