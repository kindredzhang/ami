name: "ami"
services:
  postgres:
    image: postgres:18-alpine
    container_name: ami-postgres
    environment:
      POSTGRES_DB: ami
      POSTGRES_USER: ami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ami123}
    volumes:
      - postgres_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ami"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ami-network

  pgvector:
    image: pgvector/pgvector:pg18
    container_name: ami-pgvector
    environment:
      POSTGRES_DB: ami_vector
      POSTGRES_USER: ami
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-${POSTGRES_PASSWORD:-ami123}}
    volumes:
      - pgvector_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ami -d ami_vector"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ami-network

  migrate:
    image: memohai/server:latest
    container_name: ami-migrate
    entrypoint: ["/app/ami-server", "migrate", "up"]
    volumes:
      - ${AMI_CONFIG:-./config.toml}:/app/config.toml:ro
      - ami_data:/opt/ami/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - ami-network

  server:
    stop_grace_period: 45s
    image: memohai/server:latest
    container_name: ami-server
    privileged: true
    pid: host
    # Explicit memory ceiling (CM-PRC-001): the Go runtime backs off at
    # GOMEMLIMIT instead of running into the container's OOM kill. Keep
    # GOMEMLIMIT at roughly 85% of mem_limit when overriding either.
    mem_limit: ${AMI_SERVER_MEMORY_LIMIT:-8g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOMEMLIMIT: "${AMI_SERVER_GOMEMLIMIT:-7GiB}"
      # Proxy: use host.docker.internal for localhost proxies, e.g.
      #   HTTP_PROXY=http://host.docker.internal:7890 docker compose up -d
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,pgvector,server,channel,web,migrate,webhook-tunnel,connect-it,ami-postgres,ami-pgvector,ami-server,ami-channel,ami-web,ami-migrate,ami-webhook-tunnel,ami-connect-it,skillhub,ami-skillhub"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,pgvector,server,channel,web,migrate,webhook-tunnel,connect-it,ami-postgres,ami-pgvector,ami-server,ami-channel,ami-web,ami-migrate,ami-webhook-tunnel,ami-connect-it,skillhub,ami-skillhub"
      AMI_INTERNAL_RPC_SHARED_SECRET: "${AMI_INTERNAL_RPC_SHARED_SECRET:?AMI_INTERNAL_RPC_SHARED_SECRET is required}"
      AMI_AGENT_CREDENTIALS_ENCRYPTION_KEY: "${AMI_AGENT_CREDENTIALS_ENCRYPTION_KEY:-}"
      AMI_INTERNAL_RPC_SERVER_TARGET: "server:9090"
      AMI_INTERNAL_RPC_CHANNEL_TARGET: "channel:9091"
      AMI_CONNECT_IT_BASE_URL: "${AMI_CONNECT_IT_BASE_URL:-}"
      AMI_CONNECT_IT_API_TOKEN: "${AMI_CONNECT_IT_API_TOKEN:-}"
      AMI_DISPLAY_WEBRTC_UDP_PORT: "${AMI_DISPLAY_WEBRTC_UDP_PORT:-${AMI_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}}"
    volumes:
      - ${AMI_CONFIG:-./config.toml}:/app/config.toml:ro
      - ./conf/providers:/app/conf/providers:ro
      - containerd_data:/var/lib/containerd
      - server_cni_state:/var/lib/cni
      - ami_data:/opt/ami/data
      # Expose host CDI specs to the nested containerd used for bot workspaces.
      - /etc/cdi:/etc/cdi:ro
      - /var/run/cdi:/var/run/cdi:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
      - "1455:8080"
      - "${AMI_DISPLAY_WEBRTC_UDP_PORT:-${AMI_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}}:${AMI_DISPLAY_WEBRTC_UDP_PORT:-${AMI_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}}/udp"
    expose:
      - "9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ami-network

  channel:
    image: memohai/server:latest
    container_name: ami-channel
    entrypoint: ["/app/ami-channel", "serve"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,server,channel,webhook-tunnel,ami-postgres,ami-server,ami-channel,ami-webhook-tunnel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,server,channel,webhook-tunnel,ami-postgres,ami-server,ami-channel,ami-webhook-tunnel"
      AMI_INTERNAL_RPC_SHARED_SECRET: "${AMI_INTERNAL_RPC_SHARED_SECRET:?AMI_INTERNAL_RPC_SHARED_SECRET is required}"
      AMI_INTERNAL_RPC_SERVER_TARGET: "server:9090"
      AMI_INTERNAL_RPC_CHANNEL_TARGET: "channel:9091"
      AMI_WEBHOOK_TUNNEL_MODE: "${AMI_WEBHOOK_TUNNEL_MODE:-}"
      AMI_WEBHOOK_PUBLIC_BASE_URL: "${AMI_WEBHOOK_PUBLIC_BASE_URL:-}"
      AMI_WEBHOOK_TUNNEL_LISTEN_ADDR: ":18734"
      AMI_WEBHOOK_TUNNEL_METRICS_URL: "http://webhook-tunnel:18735"
    volumes:
      - ${AMI_CONFIG:-./config.toml}:/app/config.toml:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8081"
      - "9091"
      - "18734"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Wait for the server so inbound platform messages arriving in the
      # startup window do not fail their turn RPC.
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ami-network

  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ami-webhook-tunnel
    command: tunnel --no-autoupdate --url http://channel:18734 --metrics 0.0.0.0:18735
    profiles: [webhook-tunnel]
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},channel,ami-channel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},channel,ami-channel"
    depends_on:
      - channel
    expose:
      - "18735"
    restart: unless-stopped
    networks:
      - ami-network

  # Optional co-hosted Connect-It (enable with --profile connectors). It owns
  # and migrates its own connect_it schema inside the shared ami database;
  # Ami reaches it over HTTP only. The bootstrap API token is seeded by
  # Connect-It at startup and presented by the Ami server as its bearer
  # token — the install script generates and persists all of these values.
  connect-it:
    image: "${AMI_CONNECT_IT_IMAGE:-ghcr.io/felinics/connect-it:0.3.1}"
    container_name: ami-connect-it
    profiles: [connectors]
    environment:
      DATABASE_URL: "postgres://ami:${POSTGRES_PASSWORD:-ami123}@postgres:5432/ami?sslmode=disable&search_path=connect_it"
      CONNECT_IT_SECRET_KEY: "${AMI_CONNECT_IT_SECRET_KEY:-}"
      COOKIE_SECRET: "${AMI_CONNECT_IT_COOKIE_SECRET:-}"
      CONNECT_IT_ADMIN_PASSWORD: "${AMI_CONNECT_IT_ADMIN_PASSWORD:-}"
      CONNECT_IT_BOOTSTRAP_API_TOKEN: "${AMI_CONNECT_IT_API_TOKEN:-}"
      CONNECT_IT_BASE_URL: "${AMI_CONNECT_IT_PUBLIC_BASE_URL:-http://localhost:${AMI_CONNECT_IT_PORT:-8421}}"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,server,connect-it,ami-postgres,ami-server,ami-connect-it,skillhub,ami-skillhub"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,server,connect-it,ami-postgres,ami-server,ami-connect-it,skillhub,ami-skillhub"
    ports:
      - "${AMI_CONNECT_IT_PORT:-8421}:8421"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ami-network

  web:
    image: memohai/web:latest
    container_name: ami-web
    environment:
      AMI_SERVER_UPSTREAM: ${AMI_SERVER_UPSTREAM:-ami-server:8080}
      AMI_CHANNEL_UPSTREAM: ${AMI_CHANNEL_UPSTREAM:-ami-channel:8081}
    ports:
      - "8082:8082"
      # HTTPS + HTTP/2：h2 多路复用可避免多标签页的 SSE 长连接占满浏览器对单
      # origin 的 ~6 条 HTTP/1.1 连接、导致页面卡死（#822）。取消下面两处注释
      # 并放入证书后自动启用（自签 / mkcert / Let's Encrypt 均可）。
      # - "8443:8443"
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro   # 需包含 server.crt 与 server.key
    depends_on:
      server:
        condition: service_healthy
      channel:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ami-network

volumes:
  postgres_data:
    driver: local
  pgvector_data:
    driver: local
  containerd_data:
    driver: local
  ami_data:
    driver: local
  server_cni_state:
    driver: local

networks:
  ami-network:
    driver: bridge
