name: "ami"
services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        - VERSION=${AMI_VERSION:-dev}
        - COMMIT_HASH=${AMI_COMMIT:-unknown}
        - BUILD_TIME=${AMI_BUILD_TIME:-unknown}

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        - VERSION=${AMI_VERSION:-dev}
        - COMMIT_HASH=${AMI_COMMIT:-unknown}
        - BUILD_TIME=${AMI_BUILD_TIME:-unknown}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
