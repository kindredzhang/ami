schema_version: "1"
id: hello-tool
name: Hello Tool
category: tool
icon: icon.svg
description: 一个最小的示例依赖，用于验证内部 registry 协议。
source: managed
provides:
  - hello-tool

platforms:
  - { os: linux, arch: [amd64, arm64], libc: glibc }

timeouts:
  install: 120
  remove: 60
  check_update: 30
  version: 30

scripts:
  install: install.sh
  remove: remove.sh
  check_update: check-update.sh

translations:
  en:
    description: "Minimal example dependency for verifying the internal registry protocol."
  zh:
    description: "验证内部 registry 协议的最小示例依赖。"
